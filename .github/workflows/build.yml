name: Orbit Release builds

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release for this build'
        required: false
        default: false
        type: 'boolean'
      update_version:
        description: 'Update the version number'
        required: false
        default: false
        type: 'boolean'
      update_branch:
        description: 'Update branch with new version'
        required: true
        default: 'stable'
        type: 'choice'
        options:
          - 'stable'
          - 'beta'
      use-sccache:
        description: 'Use sccache'
        required: true
        type: 'boolean'
        default: false
  workflow_call:
    inputs:
      create_release:
        description: 'Create a new release for this build'
        required: false
        default: false
        type: 'boolean'
      update_version:
        description: 'Update the version number'
        required: false
        default: false
        type: 'boolean'
      update_branch:
        description: 'Update branch with new version'
        required: true
        default: 'release'
        type: 'string'
      use-sccache:
        description: 'Use sccache'
        required: true
        type: 'boolean'
        default: false

jobs:
  buildid:
    name: Generate build ID
    runs-on: ubuntu-latest
    outputs:
      buildids: ${{ steps.get.outputs.bid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - id: get
        shell: bash -xe {0}
        run: |
          bdat=`date +"%Y%m%d%I%M%S"`
          echo "bid=${bdat}" >> $GITHUB_OUTPUT

      - name: Debug
        run: |
          echo "create_release: ${{ inputs.create_release }}"
          echo "update_version: ${{ inputs.update_version }}"
          echo "use sccache: ${{ inputs.use-sccache }}"
          echo "update_branch: ${{ inputs.update_branch }}"
          echo "GITHUB_REPOSITORY: ${{ github.repository }}"
          echo "GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"

      - name: Check if correct branch
        if: ${{ inputs.create_release }}
        run: |
          echo "Checking if we are on the correct branch"
          git branch
          git status
          git branch --show-current
          branch="${{ inputs.update_branch }}"
          if [[ $branch == "beta" ]]; then
            branch="beta"
          elif [[ $branch == "stable" ]]; then
            branch="main"
          fi
          if [[ $(git branch --show-current) != $branch ]]; then
            echo ">>> Branch mismatch"
          # exit 1
          else
            echo ">>> Branch matches"
          fi

  start-self-host:
    runs-on: ubuntu-latest
    steps:
      - name: Download aws-cli
        if: ${{ inputs.create_release && inputs.update_branch == 'stable' }}
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Start self-hosted runner
        if: ${{ inputs.create_release && inputs.update_branch == 'stable' }}
        run: |
          echo "Starting self-hosted runner"
          echo "${{ secrets.SELF_HOSTED_RUNNER_START_SCRIPT }}" | base64 -d > start.sh
          sudo chmod +x start.sh
          bash ./start.sh

      - name: Remove self-hosted runner script
        if: always() && ${{ inputs.create_release && inputs.update_branch == 'stable' }}
        run: |
          echo "Removing self-hosted runner script"
          rm start.sh || true

  build-data:
    permissions:
      contents: write
    name: Generate build data
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: buildid
    outputs:
      build_date: ${{ steps.data.outputs.builddate }}
      version: ${{ steps.data.outputs.version }}
      build_time: ${{ steps.data.outputs.buildtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile 

      - name: Bump version
        if: ${{ inputs.update_version && inputs.update_branch == 'stable' }}
        run: |
          pnpm gluon set brand ${{ inputs.update_branch }}
      - name: Bump version without new version
        if: ${{ !inputs.update_version || inputs.update_branch == 'beta' }}
        run: |
          pnpm gluon ci --brand ${{ inputs.update_branch }}

      - name: Debug
        run: |
          pnpm gluon get version
          pnpm gluon get version | xargs
          echo "$(pnpm gluon get version | xargs)"

      - name: Export release date
        id: data
        shell: bash
        run: |
          echo "builddate=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "version=$(pnpm gluon get version | xargs)" >> $GITHUB_OUTPUT
          echo "buildtime=$(date +"%H:%M:%S")" >> $GITHUB_OUTPUT

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ inputs.update_version }}
        with:
          commit_message: 🔖 Update version to ${{ steps.data.outputs.version }}
          commit_user_name: Orbit Browser Robot
          commit_user_email: orbit-browser-auto@users.noreply.github.com

  check-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-data]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@latest-10 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Activate Gluon CLI
        run: |
          pnpm gluon ci --brand ${{ inputs.update_branch }} --display-version ${{ needs.build-data.outputs.version }}

      - name: Check version
        run: |
          echo "$(pwd)"
          echo $(pnpm gluon get version | xargs)
          echo "version=$(pnpm gluon get version | xargs)" >> $GITHUB_OUTPUT
          if [[ $(pnpm gluon get version | xargs) == ${{ needs.build-data.outputs.version }} ]]; then
            echo ">>> Version matches"
          else
            echo ">>> Version mismatch"
            exit 1
          fi

  source:
    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-data, check-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Git
        run: |
          git config --global user.email "tomasps@users.noreply.github.com"
          git config --global user.name "tomasps"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Load Gluon CI setup
        run: pnpm gluon ci --brand ${{ inputs.update_branch }} --display-version ${{ needs.build-data.outputs.version }}

      - name: Download Firefox source and dependencies
        run: pnpm download --verbose

      - name: Import
        run: pnpm imp --verbose

      # - name: Build language packs
      #   run: sh scripts/download-language-packs.sh

      # - name: Compress
      #   run: |
      #     tar \
      #       --exclude='./.git' \
      #       --use-compress-program=zstd \
      #       -hcf orbit.source.tar.zst \
      #       -C engine .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: orbit.source.tar.zst
          path: ./orbit.source.tar.zst

  windows-step-1:
    name: Windows build step 1 (PGO build)
    uses: ./.github/workflows/windows-release-build.yml
    needs: [build-data, buildid]
    permissions:
      contents: write
    secrets: inherit
    with:
      use-sccache: ${{ inputs.use-sccache }}
      build-version: ${{ needs.build-data.outputs.version }}
      generate-gpo: true
      profile-data-path-archive: zen-windows-profile-data-and-jarlog.zip
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}

  windows-step-2:
    name: Windows build step 2 (Generate profile data)
    uses: ./.github/workflows/windows-profile-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [windows-step-1, build-data]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      profile-data-path-archive: zen.win64-pgo-stage-1.zip
      release-branch: ${{ inputs.update_branch }}

  windows-step-3:
    name: Windows build step 3 (build with profile data)
    uses: ./.github/workflows/windows-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, windows-step-2, start-self-host, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      generate-gpo: false
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs.use-sccache }}

  linux:
    name: Linux build
    uses: ./.github/workflows/linux-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, start-self-host, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs.use-sccache }}

  mac:
    name: macOS build
    uses: ./.github/workflows/macos-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs.use-sccache }}

  mac-uni:
    name: macOS build (Universal)
    uses: ./.github/workflows/macos-universal-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, mac]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}

  appimage:
    name: AppImage build - Linux ${{ matrix.arch }}
    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    needs: [linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@latest-10 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get -y install libfuse2 desktop-file-utils appstream

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: orbit.linux-${{ matrix.arch }}.tar.xz

      - name: Execute AppImage build
        run: |
          set -eux
          export ARCH=${{ matrix.arch }}
          UPINFO="gh-releases-zsync|$GITHUB_REPOSITORY_OWNER|desktop|latest|orbit-$ARCH.AppImage.zsync"
          rm build/AppDir/.DirIcon || true
          cp configs/branding/${{ inputs.update_branch }}/logo128.png build/AppDir/usr/share/icons/hicolor/128x128/apps/orbit.png
          cp configs/branding/${{ inputs.update_branch }}/logo128.png build/AppDir/orbit.png && ln -s orbit.png build/AppDir/.DirIcon

          if [ "${{ inputs.update_branch }}" = "beta" ]; then
            sed -i -e 's/Name=Orbit Browser/Name=Orbit Beta/g' build/AppDir/orbit.desktop
            sed -i -e 's/StartupWMClass=orbit/StartupWMClass=orbit-beta/g' build/AppDir/orbit.desktop
          fi

          APPDIR=build/AppDir
          tar -xvf *.tar.* && rm -rf *.tar.*
          mv orbit/* $APPDIR/
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          wget "https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-squashfs-lite-$ARCH"
          chmod +x *.AppImage
          chmod +x ./uruntime-appimage-squashfs-lite-"$ARCH"
          chmod +x ./build/AppDir/AppRun

          # keep the uruntime mountpoint (massively speeds up launch time)
          sed -i 's|URUNTIME_MOUNT=[0-9]|URUNTIME_MOUNT=0|' ./uruntime-appimage-squashfs-lite-"$ARCH"

          echo "AppDir: $APPDIR"
          ls -al
          find .
          ls -al "$APPDIR"
          ./appimagetool-x86_64.AppImage -u "$UPINFO" "$APPDIR" orbit-"$ARCH".AppImage --runtime-file ./uruntime-appimage-squashfs-lite-"$ARCH"
          mkdir dist
          mv orbit*AppImage* dist/.
          unset ARCH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: orbit-${{ matrix.arch }}.AppImage
          path: ./dist/orbit-${{ matrix.arch }}.AppImage

      - name: Upload artifact (ZSync)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: orbit-${{ matrix.arch }}.AppImage.zsync
          path: ./dist/orbit-${{ matrix.arch }}.AppImage.zsync

  stop-self-hosted:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [windows-step-3, linux]
    if: always()
    steps:
      - name: Download aws-cli
        if: ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Stop self-hosted runner
        if: ${{ inputs.create_release && inputs.update_branch == 'stable' }}
        run: |
          echo "Stopping self-hosted runner"
          echo "${{ secrets.SELF_HOSTED_RUNNER_STOP_SCRIPT }}" | base64 -d > stop.sh
          sudo chmod +x stop.sh
          bash ./stop.sh > /dev/null

      - name: Remove self-hosted runner script
        if: always() && ${{ inputs.create_release && inputs.update_branch == 'stable' }}
        run: |
          echo "Removing self-hosted runner script"
          rm stop.sh || true

  release:
    if: ${{ inputs.create_release || inputs.update_branch == 'beta' }}
    permissions: write-all
    name: Release
    needs:
      [
        build-data,
        linux,
        windows-step-3,
        check-release,
        mac-uni,
        appimage,
        source,
        stop-self-hosted,
      ]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ inputs.update_branch == 'stable' && 'Deploy-Stable' || 'Deploy-Beta' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Checkout updates repository
        uses: actions/checkout@v4
        with:
          repository: safecircleia/orbit-updates-server
          path: updates-server
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Download object files
        if: ${{ inputs.update_branch == 'stable' }}
        run: |
          git clone https://github.com/safecircleia/orbit-windows-binaries.git .github/workflows/object --depth 1

      - name: Copy update manifests
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
        run: |
          cd updates-server
          mkdir -p updates
          cp -a ../linux_update_manifest_x86_64/.  updates/
          cp -a ../linux_update_manifest_aarch64/.  updates/

          if [[ $RELEASE_BRANCH == 'stable' ]]; then
            cp -a ../.github/workflows/object/windows-x64-signed-x86_64/update_manifest/.  updates/
            cp -a ../.github/workflows/object/windows-x64-signed-arm64/update_manifest/.  updates/
          else
            cp -a ../windows_update_manifest_x86_64/.  updates/
            cp -a ../windows_update_manifest_arm64/.  updates/
          fi

          cp -a ../macos_update_manifest/.  updates/

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🚀 Update update manifests
          commit_user_name: Orbit Browser Robot
          commit_user_email: orbit-browser-auto@users.noreply.github.com
          repository: ./updates-server

      - name: Generate Release Notes
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
        run: bash .github/workflows/src/generate_release_notes.sh

        # If we are on Beta, we want to just update the Beta tag's release
      - name: Update Beta tag
        if: ${{ inputs.update_branch == 'beta' }}
        uses: softprops/action-gh-release@v2.2.2
        with:
          body_path: release_notes.md
          files: |
            ./orbit.source.tar.zst/*
            ./orbit.linux-x86_64.tar.xz/*
            ./orbit.linux-aarch64.tar.xz/*
            ./orbit-x86_64.AppImage/*
            ./orbit-x86_64.AppImage.zsync/*
            ./orbit-aarch64.AppImage/*
            ./orbit-aarch64.AppImage.zsync/*
            ./orbit.win-x86_64.zip/*
            ./orbit.win-arm64.zip/*
            ./linux.mar/*
            ./linux-aarch64.mar/*
            ./windows.mar/*
            ./windows-arm64.mar/*
            ./macos.mar/*
            ./orbit.installer.exe/*
            ./orbit.installer-arm64.exe/*
            ./orbit.macos-universal.dmg/*
          tag_name: 'beta'
          name: 'Beta build - ${{ needs.build-data.outputs.version }} (${{ needs.build-data.outputs.build_date }} at ${{ needs.build-data.outputs.build_time }})'
          draft: false
          generate_release_notes: false
          prerelease: true
          token: ${{ secrets.DEPLOY_KEY }}
          fail_on_unmatched_files: false
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Release
        uses: softprops/action-gh-release@v2.2.2
        if: ${{ inputs.update_branch == 'stable' }}
        with:
          token: ${{ secrets.DEPLOY_KEY }}
          tag_name: ${{ needs.build-data.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: false
          name: 'Stable build - ${{ needs.build-data.outputs.version }} (${{ needs.build-data.outputs.build_date }})'
          body_path: release_notes.md
          files: |
            ./orbit.source.tar.zst/*
            ./orbit.linux-x86_64.tar.xz/*
            ./orbit.linux-aarch64.tar.xz/*
            ./orbit-x86_64.AppImage/*
            ./orbit-x86_64.AppImage.zsync/*
            ./orbit-aarch64.AppImage/*
            ./orbit-aarch64.AppImage.zsync/*
            ./.github/workflows/object/windows-x64-signed-x86_64/orbit.win-x86_64.zip
            ./.github/workflows/object/windows-x64-signed-arm64/orbit.win-arm64.zip
            ./linux.mar/*
            ./linux-aarch64.mar/*
            ./.github/workflows/object/windows-x64-signed-x86_64/windows.mar
            ./.github/workflows/object/windows-x64-signed-arm64/windows-arm64.mar
            ./macos.mar/*
            ./.github/workflows/object/windows-x64-signed-x86_64/orbit.installer.exe
            ./.github/workflows/object/windows-x64-signed-arm64/orbit.installer-arm64.exe
            ./orbit.macos-universal.dmg/*

  prepare-flatpak:
    if: ${{ inputs.create_release && inputs.update_branch == 'stable' }}
    permissions: write-all
    name: Prepare Flatpak
    needs: [release, linux, build-data]
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: safecircleia/orbit-release-utils
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          git pull
          sudo apt-get update
          pnpm install --frozen-lockfile

      - name: Generate new Flatpak release
        run: |
          pnpm run build-flatpak -- \
            --version ${{ needs.build-data.outputs.version }}

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🚀 Update releases for Flatpak
          commit_user_name: Orbit Browser Robot
          commit_user_email: orbit-browser-auto@users.noreply.github.com

      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: safecircleia/orbit-flatpak
          token: ${{ secrets.DEPLOY_KEY }}
          path: flatpak

      - name: Move releases.xml
        run: |
          pwd
          ls .
          ls ..
          mv releases.xml ./flatpak/com.safecircle.orbit.metainfo.xml
          # output the version to the file
          echo -n ${{ needs.build-data.outputs.version }} > ./flatpak/version

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[release]: Update Flatpak manifest'
          commit_user_name: Orbit Browser Robot
          commit_user_email: orbit-browser-auto@users.noreply.github.com
          repository: ./flatpak

      - name: Wait 2 minutes for the Flatpak repo to update
        run: sleep 120

  release-flatpak:
    if: ${{ inputs.create_release && inputs.update_branch == 'stable' }}
    permissions: write-all
    name: Release Flatpak
    needs: [prepare-flatpak, build-data]
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: flathub/com.safecircle.orbit
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: orbit.linux-x86_64.tar.xz

      - name: Download Linux aarch64 build
        uses: actions/download-artifact@v4
        with:
          name: orbit.linux-aarch64.tar.xz

      - name: Update repository
        uses: actions/checkout@v4
        with:
          path: zen-browser
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Download Flatpak archive
        run: |
          wget https://github.com/safecircleia/orbit-flatpak/releases/latest/download/archive.tar -O archive.tar

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Flatpak manifest
        run: |
          python3 ./orbit-browser/scripts/prepare-flatpak-release.py \
            --flatpak-archive archive.tar \
            --version ${{ needs.build-data.outputs.version }} \
            --linux-archive orbit.linux-x86_64.tar.xz \
            --linux-aarch64-archive orbit.linux-aarch64.tar.xz \
            --output com.safecircle.orbit.yml \
            --template-root ./orbit-browser/build/flatpak

      - name: Commit changes
        run: |
          git add com.safecircle.orbit.yml
          git commit -m "Update to version ${{ needs.build-data.outputs.version }}"

      - name: Clean up
        run: |
          rm -rf orbit-browser
          rm -rf archive.tar
          rm -rf orbit.linux-x86_64.tar.xz
          rm -rf orbit.linux-aarch64.tar.xz

      - name: Upload Flatpak manifest
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: com.safecircle.orbit.yml
          path: ./com.safecircle.orbit.yml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        env:
          GIT_TRACE: 1
          GIT_CURL_VERBOSE: 1
        with:
          token: ${{ secrets.DEPLOY_KEY }}
          commit-message: Update to version `${{ needs.build-data.outputs.version }}`
          title: Update to version `${{ needs.build-data.outputs.version }}`
          body: |
            This PR updates the Orbit Browser Flatpak package to version ${{ needs.build-data.outputs.version }}.

            @${{ github.actor }} please review and merge this PR.
          branch: update-to-${{ needs.build-data.outputs.version }}
          base: master
          git-token: ${{ secrets.DEPLOY_KEY }}
          delete-branch: true
